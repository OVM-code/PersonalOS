  $('#pane-events').addEventListener('click', e => {
    const segBtn = e.target.closest('#segEv button[data-v]');
    if(segBtn){
      const t = $('#evTitle').value, d = $('#evDate').value, u = $('#evUrl').value, n = $('#evNote').value;
      evMode = segBtn.dataset.v;
      renderEvents();
      $('#evTitle').value = t; $('#evDate').value = d; $('#evUrl').value = u; $('#evNote').value = n;
      return;
    }
    const act = e.target.dataset.act;
    if(act === 'addev'){ addEvent(); return; }
    const row = e.target.closest('[data-eid]');
    if(!row) return;
    const ev = state.events.find(x => x.id === row.dataset.eid);
    if(!ev) return;
    const final = EV_STAGES[ev.mode].length - 1;
    if(act === 'evfw' && ev.stage < final){
      ev.stage++;
      if(ev.mode === 'organize' && ev.stage === final){
        state.wins.push({id:uid(), text:'Organized: ' + ev.title, t:now()});
        winSpot = null;
        toast('Done — logged in your wins');
      }
      saveState(); renderEvents();
    } else if(act === 'evbk' && ev.stage > 0){
      ev.stage--;
      saveState(); renderEvents();
    } else if(act === 'delev'){
      if(!confirm('Remove ' + (ev.title || 'this event') + '?')) return;
      state.events = state.events.filter(x => x.id !== ev.id);
      saveState(); renderEvents();
    }
  });
  $('#pane-events').addEventListener('keydown', e => {
    if(['evTitle','evUrl','evNote'].includes(e.target.id) && e.key === 'Enter') addEvent();
  });

  /* ================= sweep ================= */
  let sweepQueue = [], sweepIdx = 0, sweepClosed = 0, sweepDropped = 0, sweepKept = 0;

  function startSweep(){
    resetRecurringIfNewWeek();
    sweepQueue = state.items
      .filter(it => it.type !== 'recurring' || !it.doneThisWeek)
      .sort((a,b) => ageDays(b.created) - ageDays(a.created));
    sweepIdx = 0; sweepClosed = 0; sweepDropped = 0; sweepKept = 0;
    if(!sweepQueue.length){ toast('Nothing to sweep — head is clear'); return; }
    $('#overlay').classList.add('open');
    renderSweep();
  }

  function renderSweep(){
    const box = $('#sweepBody');
    if(sweepIdx >= sweepQueue.length){
      state.lastSweep = now(); saveState();
      box.innerHTML =
        '<div class="summary-big">Swept.</div>' +
        '<div class="summary-sub">' + sweepClosed + ' closed · ' + sweepDropped + ' dropped · ' + sweepKept + ' kept on the books.</div>' +
        '<div class="sweep-actions"><button class="sw-done" data-a="exitok">Back to the board</button></div>';
      return;
    }
    const it = sweepQueue[sweepIdx];
    const dom = DOMAINS.find(d => d.k === it.domain).label;
    const age = ageDays(it.created);
    const rec = it.type === 'recurring';
    const dd = dueDays(it.due);
    box.innerHTML =
      '<div class="progress">' + (sweepIdx+1) + ' of ' + sweepQueue.length + '</div>' +
      '<div class="q">' + (rec ? 'Handled this week?' : 'Still worth headspace?') + '</div>' +
      '<div class="sweep-card"><div class="text">' + esc(it.text) + '</div>' +
      (it.nextStep ? '<div class="nextline">' + esc(it.nextStep) + '</div>' : '') +
      '<div class="meta"><span class="chip">' + dom + '</span>' +
      '<span class="chip type">' + TYPES[it.type].label + '</span>' +
      (goalLabel(it) ? '<span class="chip goal">' + esc(goalLabel(it)) + '</span>' : '') +
      (it.who ? '<span class="chip who">' + esc(it.who) + '</span>' : '') +
      '<span class="age' + (isStale(it)?' stale':'') + '">' + (rec?'weekly':(age===0?'today':age+' days old')) + '</span>' +
      (dd !== null ? '<span class="due ' + dueClass(dd) + '">' + dueLabel(dd) + '</span>' : '') +
      '</div></div>' +
      '<div class="sweep-actions">' +
      '<button class="sw-done" data-a="done">' + (rec?'Done for this week':'Done — close it') + '</button>' +
      '<button class="sw-keep" data-a="keep">Keep it</button>' +
      (rec ? '' : '<button class="sw-drop" data-a="drop">Drop it</button>') +
      '</div>' +
      '<button class="exit" data-a="exit">Finish sweep early</button>';
  }

  $('#sweepBody').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if(!b) return;
    const a = b.dataset.a;
    if(a === 'exit' || a === 'exitok'){
      state.lastSweep = now(); saveState(); closeSweep(); return;
    }
    const it = sweepQueue[sweepIdx];
    if(a === 'done'){
      if(it.type==='recurring'){ it.doneThisWeek = true; it.weekKey = thisWeek(); }
      else { const gl = goalLabel(it); state.items = state.items.filter(x => x.id !== it.id); logEvent('closed', gl); }
      sweepClosed++;
    } else if(a === 'drop'){
      const gl = goalLabel(it);
      state.items = state.items.filter(x => x.id !== it.id);
      logEvent('dropped', gl); sweepDropped++;
    } else if(a === 'keep'){ sweepKept++; }
    saveState(); sweepIdx++; renderSweep();
  });

  function closeSweep(){ $('#overlay').classList.remove('open'); render(); }
  $('#startSweep').addEventListener('click', startSweep);
  document.addEventListener('keydown', e => {
    if(e.key==='Escape' && $('#overlay').classList.contains('open')){
      state.lastSweep = now(); saveState(); closeSweep();
    }
  });

  /* ================= export / import ================= */
  $('#exportMd').addEventListener('click', () => {
    let md = '# Open loops — ' + dateKey() + ' (' + thisWeek() + ')\n';
    DOMAINS.forEach(dom => {
      const list = state.items.filter(it => it.domain === dom.k);
      if(!list.length) return;
      md += '\n## ' + dom.label + '\n';
      list.forEach(it => {
        const rec = it.type==='recurring';
        const bits = [];
        if(rec) bits.push(it.doneThisWeek ? 'done this week' : 'this week');
        else { bits.push(ageDays(it.created) + 'd open'); if(isStale(it)) bits.push('stale'); }
        const dd = dueDays(it.due); if(dd !== null) bits.push(dueLabel(dd));
        if(it.who) bits.push('waiting on ' + it.who);
        if(it.star) bits.push('priority');
        md += '- [' + TYPES[it.type].label + '] ' + it.text +
          (it.nextStep ? ' → ' + it.nextStep : '') + ' _(' + bits.join(', ') + ')_\n';
        if(it.note) md += '  - note: ' + it.note.replace(/\n/g, ' ') + '\n';
      });
    });
    if(state.goals.length){
      md += '\n## Goals\n';
      state.goals.forEach(g => {
        if(!g.yearly && !g.monthly && !g.weekly) return;
        md += '- ' + (g.yearly||'—') + (g.monthly?' · month: '+g.monthly:'') + (g.weekly?' · week: '+g.weekly:'') + '\n';
      });
    }
    if(state.habits.length){
      const mon = mondayOfThisWeek();
      md += '\n## Habits (this week)\n';
      state.habits.forEach(h => {
        let c = 0;
        for(let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); if(h.checks[dateKey(d)]) c++; }
        md += '- ' + h.name + ': ' + c + (h.target?'/'+h.target:'') + ' · streak ' + streak(h) + 'd\n';
      });
    }
    if(state.events.length){
      md += '\n## Events\n';
      [['attend','To attend'],['organize','To organize']].forEach(([mk, label]) => {
        const stages = EV_STAGES[mk], final = stages.length - 1;
        const list = state.events.filter(ev => ev.mode === mk && ev.stage !== final);
        if(!list.length) return;
        md += '\n### ' + label + '\n';
        list.forEach(ev => md += '- ' + ev.title + ' \u2014 ' + stages[ev.stage] +
          (ev.date ? ', ' + ev.date : '') + (ev.url ? ', ' + ev.url : '') +
          (ev.note ? ' _(' + ev.note + ')_' : '') + '\n');
      });
    }
    if(state.library.some(l => !l.done)){
      md += '\n## Library (open)\n';
      LIB_KINDS.forEach(k => {
        const list = state.library.filter(l => l.kind === k.k && !l.done);
        if(!list.length) return;
        md += '\n### ' + k.label + '\n';
        list.forEach(l => md += '- ' + l.title + (l.url ? ' \u2014 ' + l.url : '') + (l.note ? ' _(' + l.note + ')_' : '') + '\n');
      });
    }
    if(state.wins.length){
      md += '\n## Recent wins\n';
      state.wins.slice().sort((a,b) => new Date(b.t) - new Date(a.t)).slice(0,8)
        .forEach(w => md += '- ' + w.text + ' _(' + fmtDate(w.t) + ')_\n');
    }
    const activeM = state.manifest.filter(m => !m.realized);
    if(activeM.length){
      md += '\n## Manifestations (active)\n';
      activeM.forEach(m => md += '- ' + m.text + (m.why ? ' — because ' + m.why : '') + '\n');
    }
    const je = state.journal[dateKey()];
    if(je && (je.mood || je.energy || je.mind || je.track)){
      md += '\n## Today\u2019s check-in\n';
      if(je.mood || je.energy) md += '- ' + (je.mood?'mood ' + je.mood + '/5':'') + (je.mood && je.energy?' · ':'') + (je.energy?'energy ' + je.energy + '/5':'') + '\n';
      if(je.mind) md += '- how I am: ' + je.mind.replace(/\n/g,' ') + '\n';
      if(je.track) md += '- on track: ' + je.track.replace(/\n/g,' ') + '\n';
    }
    navigator.clipboard.writeText(md)
      .then(() => toast('Markdown copied — paste into your context pack'))
      .catch(() => { window.prompt('Copy the markdown below:', md); });
  });

  $('#exportJson').addEventListener('click', () => {
    state.lastExport = now(); saveState();
    const payload = Object.assign({_meta:{app:'open-loops', schemaVersion:4, exported:now()}}, state);
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'open-loops-' + dateKey() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    renderBackupNote(); toast('Exported — backup is fresh');
  });

  function renderBackupNote(){
    const el = $('#backupNote');
    const hasData = state.items.length || state.wins.length || state.habits.length ||
      state.manifest.length || state.pipeline.length || state.library.length ||
      state.events.length || Object.keys(state.journal).length;
    let txt = '';
    if(hasData){
      if(!state.lastExport) txt = 'No backup yet — export JSON';
      else if(ageDays(state.lastExport) > 14) txt = 'Backup ' + ageDays(state.lastExport) + 'd old — export JSON';
    }
    el.style.display = txt ? '' : 'none';
    el.textContent = txt;
  }
  $('#backupNote').addEventListener('click', () => $('#exportJson').click());

  function mergeStates(localS, importedS){
    const L = normalizeState(localS), I = normalizeState(importedS);
    const M = normalizeState(localS); // base copy
    const byId = arr => new Map(arr.map(x => [x.id, x]));
    // id-matched collections: imported wins on conflict, merge never deletes
    ['items','goals','wins','manifest','pipeline','grocery','library','events'].forEach(k => {
      const m = byId(L[k]);
      I[k].forEach(x => m.set(x.id, x));
      M[k] = Array.from(m.values());
    });
    // habits: imported wins on fields, daily checks are unioned
    {
      const m = byId(L.habits);
      I.habits.forEach(h => {
        const loc = m.get(h.id);
        m.set(h.id, loc ? Object.assign({}, loc, h, {checks: Object.assign({}, loc.checks, h.checks)}) : h);
      });
      M.habits = Array.from(m.values());
    }
    // journal: merge by day, LOCAL wins on conflict (device is source of truth)
    M.journal = Object.assign({}, I.journal, L.journal);
    // log: concat + dedupe + chronological
    const seen = new Set();
    M.log = L.log.concat(I.log).filter(ev => {
      const k = ev.t + '|' + ev.a + '|' + (ev.g||'');
      if(seen.has(k)) return false;
      seen.add(k); return true;
    }).sort((a,b) => new Date(a.t) - new Date(b.t));
    // goal history: dedupe by month
    const gh = new Map();
    L.goalHistory.concat(I.goalHistory).forEach(h => gh.set(h.month, h));
    M.goalHistory = Array.from(gh.values()).sort((a,b) => a.month < b.month ? -1 : 1);
    // scalars
    M.lastSweep  = [L.lastSweep, I.lastSweep].filter(Boolean).sort().pop() || null;
    M.lastExport = [L.lastExport, I.lastExport].filter(Boolean).sort().pop() || null;
    M.theme = L.theme;
    M.goalMonth = L.goalMonth || I.goalMonth;
    M.pendingGoalReset = L.pendingGoalReset;
    return M;
  }

  $('#importFile').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!Array.isArray(data.items)) throw new Error('bad format');
        const hasLocal = state.items.length || state.wins.length || state.habits.length ||
          state.manifest.length || state.pipeline.length || state.library.length ||
          state.events.length || Object.keys(state.journal).length;
        if(hasLocal && confirm('MERGE the file into your current data?\n\nOK = merge (recommended for OS round-trips: nothing is deleted, imported changes win on conflicts, journal days on this device are kept).\n\nCancel = REPLACE everything with the file.')){
          state = mergeStates(state, data);
          toast('Merged — ' + state.items.length + ' loops on the board');
        } else {
          state = normalizeState(data);
          toast('Replaced — ' + state.items.length + ' loops imported');
        }
        saveState(); applyTheme(); render();
      }catch(err){ toast('Import failed — not a valid export file'); }
    };
    r.readAsText(f); e.target.value = '';
  });
  document.querySelector('label[for=importFile]').addEventListener('click', () => $('#importFile').click());

  /* ================= render dispatch & boot ================= */
  function render(){
    resetRecurringIfNewWeek();
    const mk = new Date().toISOString().slice(0,7);
    if(!state.goalMonth){ state.goalMonth = mk; saveState(); }
    else if(state.goalMonth !== mk){
      const snap = state.goals.filter(g => g.monthly || g.weekly)
        .map(g => ({yearly:g.yearly, monthly:g.monthly, weekly:g.weekly}));
      if(snap.length) state.goalHistory.push({month:state.goalMonth, goals:snap});
      state.goalMonth = mk;
      state.pendingGoalReset = state.goals.length > 0;
      saveState();
    }
    renderHeader();
    renderBackupNote();
    if(activeTab==='loops') renderLoops();
    else if(activeTab==='today') renderToday();
    else if(activeTab==='habits') renderHabits();
    else if(activeTab==='journal') renderJournal();
    else if(activeTab==='manifest') renderManifest();
    else if(activeTab==='wins') renderWins();
    else if(activeTab==='events') renderEvents();
    else if(activeTab==='grocery') renderGrocery();
    else if(activeTab==='library') renderLibrary();
    else if(activeTab==='stats') renderStats();
  }

  $('#storageNote').textContent = storageAvailable()
    ? 'Saved in this browser'
    : 'Preview mode — save the file and open locally to persist';
  applyTheme();
  render();
})();
</script>
</body>
</html>
